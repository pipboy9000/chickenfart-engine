<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="font-awesome-4.7.0/css/font-awesome.min.css">
    <title>Chickenfart</title>
    <link rel="stylesheet" href="style.css">
</head>

<script>
    function setFilter(filter) {
        document.getElementById("canvas").className = 'filter-' + filter;
    }
</script>

<body>

    <script type="importmap">
    {
        "imports": {
            "@chickenfart/engine": "./engine/index.js",
            "@chickenfart/engine/world": "./engine/world.js",
            "@chickenfart/engine/canvas": "./engine/canvas.js",
            "@chickenfart/engine/collision": "./engine/collision.js",
            "@chickenfart/engine/input": "./engine/input.js",
            "@chickenfart/engine/floorTiles": "./engine/floorTiles.js",
            "@chickenfart/engine/entitiesFactory": "./engine/entitiesFactory.js",
            "@chickenfart/engine/sound": "./engine/Sound.js",
            "@chickenfart/engine/utils": "./engine/utils.js",
            "@chickenfart/engine/ParticleSystem": "./engine/ParticleSystem.js"
        }
    }
    </script>

    <script src="src/main.js" type="module"></script>

    <div id="all">

        <canvas id="canvas" class="filter-default"></canvas>

        <div id="mainMenu">
            <button id="newGame">
                <span>New Game</span>
            </button>
            <!-- <button disabled>Continue</button> -->
        </div>

        <!-- <div class="buttons">
            <div class="button" onclick="setFilter('morning')">
                <i class="fa fa-sun-o" aria-hidden="true"></i>
            </div>
            <div class="button" onclick="setFilter('default')">
                <i class="fa fa-clock-o" aria-hidden="true"></i>
            </div>
            <div class="button" onclick="setFilter('night')">
                <i class="fa fa-moon-o" aria-hidden="true"></i>
            </div>
        </div> -->

</body>

</html>
